version: '3.8'

services:
  # База данных PostgreSQL
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (для Celery)
  redis:
    image: redis:7-alpine
    # volumes:
    #   - redis_data:/data # Раскомментируйте, если хотите сохранять данные Redis

  # Основное Django-приложение (для админки и API)
  web:
    image: shlicha/dairy_bot:v2
    env_file:
      - .env
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # - ./app:/app # Раскомментируйте для разработки, чтобы изменения кода применялись без пересборки
    expose:
      - "8000"
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - YANDEX_SPEECHKIT_API_KEY=${YANDEX_SPEECHKIT_API_KEY}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - LOG_LEVEL=${LOG_LEVEL}
      - SENTENCE_TRANSFORMERS_MODEL_NAME=${SENTENCE_TRANSFORMERS_MODEL_NAME:-ai-forever/sbert_large_nlu_ru}
      - SENTENCE_TRANSFORMERS_DEVICE=${SENTENCE_TRANSFORMERS_DEVICE:-cpu}
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME:-/app/.cache/sentence-transformers}
      - HF_HOME=${HF_HOME:-/app/.cache/huggingface}
      - TRANSFORMERS_CACHE=${TRANSFORMERS_CACHE:-/app/.cache/huggingface/transformers}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Celery Worker
  celery_worker:
    image: shlicha/dairy_bot:v2
    env_file:
      - .env
    command: celery -A core worker --loglevel=info
    environment:
      - DEBUG=${DEBUG}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - YANDEX_SPEECHKIT_API_KEY=${YANDEX_SPEECHKIT_API_KEY}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SENTENCE_TRANSFORMERS_MODEL_NAME=${SENTENCE_TRANSFORMERS_MODEL_NAME:-ai-forever/sbert_large_nlu_ru}
      - SENTENCE_TRANSFORMERS_DEVICE=${SENTENCE_TRANSFORMERS_DEVICE:-cpu}
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME:-/app/.cache/sentence-transformers}
      - HF_HOME=${HF_HOME:-/app/.cache/huggingface}
      - TRANSFORMERS_CACHE=${TRANSFORMERS_CACHE:-/app/.cache/huggingface/transformers}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started # Убедиться, что миграции выполнены

  # Celery Beat (для периодических задач)
  celery_beat:
    image: shlicha/dairy_bot:v2
    env_file:
      - .env
    command: celery -A core beat -S django_celery_beat.schedulers:DatabaseScheduler --loglevel=info
    environment:
      - DEBUG=${DEBUG}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - YANDEX_SPEECHKIT_API_KEY=${YANDEX_SPEECHKIT_API_KEY}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SENTENCE_TRANSFORMERS_MODEL_NAME=${SENTENCE_TRANSFORMERS_MODEL_NAME:-ai-forever/sbert_large_nlu_ru}
      - SENTENCE_TRANSFORMERS_DEVICE=${SENTENCE_TRANSFORMERS_DEVICE:-cpu}
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME:-/app/.cache/sentence-transformers}
      - HF_HOME=${HF_HOME:-/app/.cache/huggingface}
      - TRANSFORMERS_CACHE=${TRANSFORMERS_CACHE:-/app/.cache/huggingface/transformers}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started # Убедиться, что миграции выполнены

  # Telegram Bot (отдельный сервис)
  telegram_bot:
    image: shlicha/dairy_bot:v2
    env_file:
      - .env
    command: python manage.py runbot
    environment:
      - DEBUG=${DEBUG}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - YANDEX_SPEECHKIT_API_KEY=${YANDEX_SPEECHKIT_API_KEY}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SENTENCE_TRANSFORMERS_MODEL_NAME=${SENTENCE_TRANSFORMERS_MODEL_NAME:-ai-forever/sbert_large_nlu_ru}
      - SENTENCE_TRANSFORMERS_DEVICE=${SENTENCE_TRANSFORMERS_DEVICE:-cpu}
      - SENTENCE_TRANSFORMERS_HOME=${SENTENCE_TRANSFORMERS_HOME:-/app/.cache/sentence-transformers}
      - HF_HOME=${HF_HOME:-/app/.cache/huggingface}
      - TRANSFORMERS_CACHE=${TRANSFORMERS_CACHE:-/app/.cache/huggingface/transformers}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started # Убедиться, что миграции выполнены

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      # - "443:443" # Если будет HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  # redis_data: # Раскомментируйте, если используете
  static_volume:
  media_volume:
